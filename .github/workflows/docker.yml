name: Build and Push Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: write   # REQUIRED to push tags

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # IMPORTANT: fetch all history + tags

      # 2. Fetch tags explicitly
      - name: Fetch tags
        run: git fetch --tags

      # 3. Get latest tag (fallback to 1.0.0 if none)
      - name: Get latest tag
        id: get_tag
        run: |
          tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "1.0.0")
          echo "tag=$tag" >> $GITHUB_OUTPUT

      # 4. Increment PATCH version
      - name: Increment version
        id: increment
        run: |
          version=${{ steps.get_tag.outputs.tag }}
          IFS='.' read -r major minor patch <<< "$version"
          patch=$((patch + 1))
          new_version="$major.$minor.$patch"
          echo "new_version=$new_version" >> $GITHUB_OUTPUT

      # 5. Create and push new Git tag
      - name: Create Git tag
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag ${{ steps.increment.outputs.new_version }}
          git push origin ${{ steps.increment.outputs.new_version }}

      # 6. Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 7. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 8. Build and Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKER_USERNAME }}/nextjs-static:${{ steps.increment.outputs.new_version }}
            ${{ vars.DOCKER_USERNAME }}/nextjs-static:latest